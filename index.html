<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронды Журнал және Табель</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-6 max-w-5xl">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">🏫 Мектептің Электронды Журналы</h1>
            <span class="text-sm bg-indigo-500 px-3 py-1 rounded-lg">Сынып: 10 "А"</span>
        </header>

        <!-- Gradebook Table -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Журнал және Бағалау</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-sm">
                            <th class="p-3">Оқушы аты-жөні</th>
                            <th class="p-3 text-center">БЖБ (40%)</th>
                            <th class="p-3 text-center">ТЖБ (60%)</th>
                            <th class="p-3 text-center">Қорытынды баға</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable" class="text-gray-600 text-sm divide-y divide-gray-200">
                        <!-- JavaScript арқылы толықтырылады -->
                    </tbody>
                </table>
            </div>
            <button onclick="calculateGrades()" class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                Бағаларды есептеу
            </button>
        </div>

        <!-- Report Card Preview Section -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Табель үлгісі (Report Card)</h2>
            <div id="reportCard" class="border border-gray-300 p-4 rounded-lg bg-gray-50">
                <p class="text-gray-500 text-center">Бағаларды есептегеннен кейін мұнда табель пайда болады.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
